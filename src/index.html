  <script>
    // 首帧即应用主题，避免浅色闪烁
    (function () {
      var s = null, t = 'auto';
      try { s = JSON.parse(localStorage.getItem('cm1.settings') || 'null'); t = (s && s.theme) || localStorage.getItem('cm1.theme') || 'auto'; } catch (e) {}
      if (t !== 'light' && t !== 'dark') t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      document.documentElement.setAttribute('data-theme', t);
      if (s && s.uiScale) document.documentElement.style.setProperty('--uiz', String(s.uiScale));
    })();
  </script>
